name: 同步心迹安装包到网站
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载安装包
        run: |
          mkdir -p 心迹-源码/public
          curl -sSL -f -o "心迹-源码/public/心迹.apk" "https://github.com/alin715901/heart-trace/releases/download/apk-5/heart-trace.apk"
          ls -lh "心迹-源码/public/心迹.apk"
      - name: 提交到网站
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "心迹-源码/public/心迹.apk"
          git commit -m "发布：心迹.apk" || echo "无变更"
          git push
