name: 同步心迹安装包到网站
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备安装包与下载页
        run: |
          mkdir -p 心迹-源码/public
          curl -sSL -f -o "心迹-源码/public/heart-trace.apk" "https://github.com/alin715901/heart-trace/releases/download/apk-5/heart-trace.apk"
          cp "心迹-源码/public/heart-trace.apk" "心迹-源码/public/心迹.apk"
          echo  | base64 -d > "心迹-源码/public/download.html"
          ls -lh 心迹-源码/public/
      - name: 提交到网站
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "心迹-源码/public/heart-trace.apk" "心迹-源码/public/心迹.apk" "心迹-源码/public/download.html"
          git commit -m "发布：中文名安装包与下载页" || echo "无变更"
          git push
