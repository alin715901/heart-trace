name: 构建心迹APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受安卓许可
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 构建网页
        run: |
          cd 心迹-源码
          npm install
          NETLIFY=1 npm run build

      - name: 生成安卓工程
        run: |
          cd 心迹-源码
          npm install -D @capacitor/cli @capacitor/core @capacitor/android
          echo '{"appId":"com.xinji.hearttrace","appName":"心迹","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync
          echo "" >> android/build.gradle
          echo "allprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/build.gradle
          echo "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">心迹</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">心迹</string>#' android/app/src/main/res/values/strings.xml
          grep -E 'app_name|title_activity_main' android/app/src/main/res/values/strings.xml
          unzip -o android-icons.zip -d android/app/src/main/res/
          find android/app/src/main/res/values -type f -name '*.xml' -print0 | xargs -0 -r sed -i -E 's/(<color name="ic_launcher_background">)[^<]*(<\/color>)/\1#EFE9FF\2/g'
          ls -l android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: 构建APK
        run: |
          cd 心迹-源码/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/心迹.apk

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: xinji-apk
          path: 心迹-源码/android/app/build/outputs/apk/debug/心迹.apk

      - name: 发布到下载页
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="心迹-源码/android/app/build/outputs/apk/debug/app-debug.apk"
          TAG="apk-${{ github.run_number }}"
          RID=$(curl -sS -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"             -d "{\"tag_name\":\"${TAG}\",\"name\":\"心迹 安装包\"}"             | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "release id: ${RID}"
          curl -sS -f -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Content-Type: application/octet-stream"             --data-binary "@${APK}"             "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=%E5%BF%83%E8%BF%B9.apk"
          echo "上传完成: 心迹.apk"

      - name: 更新网站下载文件
        run: |
          cp 心迹-源码/android/app/build/outputs/apk/debug/app-debug.apk 心迹-源码/public/心迹.apk
          cp 心迹-源码/android/app/build/outputs/apk/debug/app-debug.apk 心迹-源码/public/heart-trace.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f 心迹-源码/public/心迹.apk 心迹-源码/public/heart-trace.apk
          git commit -m "更新：带心迹图标的安装包" || echo "无变更"
          git push
