name: 构建心迹APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本号（留空则自动递增修订号，如 1.2.1 -> 1.2.2）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '心迹-源码/.apk-rebuild'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算本次版本号
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          cd 心迹-源码
          PREV=$(python3 -c "import json;print(json.load(open('public/version.json'))['version'])")
          if [ -n "$MANUAL_VERSION" ]; then
            NEXT="$MANUAL_VERSION"
          else
            MAJOR=$(echo "$PREV" | cut -d. -f1)
            MINOR=$(echo "$PREV" | cut -d. -f2)
            PATCH=$(echo "$PREV" | cut -d. -f3)
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "APP_VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "上一个版本: $PREV  ->  本次版本: $NEXT（构建号 ${{ github.run_number }}）"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受安卓许可
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 构建网页
        run: |
          cd 心迹-源码
          CODE=${{ github.run_number }}
          VERSION="${APP_VERSION}"
          npm install
          rm -f public/*.apk
          cat > public/version.json <<EOF
          {"version":"${VERSION}","code":${CODE},"apkUrl":"https://alin715901.github.io/heart-trace/heart-trace.apk","releaseUrl":"https://github.com/alin715901/heart-trace/releases/tag/apk-${CODE}","notes":"心迹 v${VERSION}（构建号 ${CODE}）：体验优化与问题修复"}
          EOF
          VITE_APP_VERSION=${VERSION} VITE_BUILD_CODE=${CODE} VITE_VERSION_URL=https://alin715901.github.io/heart-trace/version.json VITE_BASE_PATH=/ npm run build
          echo "版本清单:" && cat public/version.json

      - name: 生成安卓工程
        run: |
          cd 心迹-源码
          export CODE=${{ github.run_number }}
          export VERSION="${APP_VERSION}"
          npm install -D "@capacitor/cli@^7" "@capacitor/android@^7"
          echo '{"appId":"com.xinji.hearttrace","appName":"心迹","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync
          # 系统安装器读取的是安卓工程里的 versionName / versionCode，
          # 不更新的话覆盖安装会被提示「已安装相同版本 1.0」
          python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          code, version = os.environ['CODE'], os.environ['VERSION']
          if re.search(r'versionCode\s+\d+', s):
              s = re.sub(r'(versionCode\s+)\d+', r'\g<1>' + code, s, count=1)
          else:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        versionCode ' + code, 1)
          if re.search(r'versionName\s+"[^"]*"', s):
              s = re.sub(r'(versionName\s+)"[^"]*"', r'\g<1>"' + version + '"', s, count=1)
          else:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        versionName "' + version + '"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          assert re.search(r'versionCode\s+' + code + r'\b', s), 'versionCode 未写入'
          assert 'versionName "' + version + '"' in s, 'versionName 未写入'
          print('安卓版本号已写入:', version, '(' + code + ')')
          PY
          grep -E 'versionCode|versionName' android/app/build.gradle
          echo "" >> android/build.gradle
          echo "allprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/build.gradle
          echo "        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">心迹</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">心迹</string>#' android/app/src/main/res/values/strings.xml
          unzip -o android-icons.zip -d android/app/src/main/res/
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import glob
          for f in glob.glob('android/app/src/main/res/mipmap-*/ic_launcher_foreground.png'):
              im = Image.open(f).convert('RGBA')
              bbox = im.getchannel('A').getbbox()
              ratio = (bbox[2] - bbox[0]) / im.width
              if ratio <= 0.55:
                  print('already small', f, round(ratio, 3))
                  continue
              star = im.crop(bbox)
              nw, nh = round(star.width * 0.81), round(star.height * 0.81)
              star = star.resize((nw, nh), Image.LANCZOS)
              out = Image.new('RGBA', im.size, (0, 0, 0, 0))
              out.alpha_composite(star, ((im.width - nw) // 2, (im.height - nh) // 2))
              out.save(f)
              print('shrunk', f, nw, nh)
          PY
          find android/app/src/main/res/values -type f -name '*.xml' -print0 | xargs -0 -r sed -i -E 's/(<color name="ic_launcher_background">)[^<]*(<\/color>)/\1#EFE9FF\2/g'
          # 固定签名密钥：保证每次构建签名一致，可直接覆盖安装
          mkdir -p ~/.android
          base64 -d debug.keystore.b64 > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null && echo "签名密钥已固定"
          # 应用内更新插件
          PKG=android/app/src/main/java/com/xinji/hearttrace
          cp android-extra/ApkUpdaterPlugin.java "$PKG/ApkUpdaterPlugin.java"
          cp android-extra/MainActivity.java "$PKG/MainActivity.java"
          mkdir -p android/app/src/main/res/xml
          cp android-extra/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application',
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          provider = open('android-extra/manifest-provider.xml', encoding='utf-8').read()
          if 'fileprovider' not in s:
              s = s.replace('</application>', provider + '    </application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('manifest patched')
          PY
          grep -E 'REQUEST_INSTALL_PACKAGES|fileprovider' android/app/src/main/AndroidManifest.xml
          ls -l "$PKG"

      - name: 构建APK
        run: |
          cd 心迹-源码/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          KS=app/xinji.keystore
          base64 -d ../debug.keystore.b64 > "$KS"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256' | head -1 | tr -d ' :' | tr 'A-F' 'a-f')
          echo "安装包证书: $CERT"
          echo "$CERT" | grep -q '2226a45a9cb646a9' || { echo "签名未固定，终止发布"; exit 1; }
          cp "$APK" ../dist/heart-trace.apk
          cp "$APK" ../dist/心迹.apk
          cp "$APK" ../public/heart-trace.apk
          cp "$APK" ../public/心迹.apk

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: xinji-apk
          path: 心迹-源码/android/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="心迹-源码/android/app/build/outputs/apk/debug/app-debug.apk"
          export CODE=${{ github.run_number }}
          export TAG="apk-${CODE}"
          export NAME="心迹 v${APP_VERSION} · 构建号 ${CODE}"
          export VERSION="${APP_VERSION}"
          python3 - <<'PY'
          import os, json
          p = {
              'tag_name': os.environ['TAG'],
              'name': os.environ['NAME'],
              'body': '心迹 v%s，构建号 %s。覆盖安装，已有记录不会丢失。' % (os.environ['VERSION'], os.environ['CODE']),
          }
          open('release.json', 'w', encoding='utf-8').write(json.dumps(p, ensure_ascii=False))
          print('release payload:', p['name'])
          PY
          RID=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d @release.json \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "release id: ${RID}"
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${APK}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=heart-trace.apk"
          echo "上传完成: heart-trace.apk（v${APP_VERSION}）"

      - name: 重建网站产物
        run: |
          cd 心迹-源码
          # 网页部署在 /heart-trace/ 子路径，必须按子路径构建；
          # 前面的根路径产物仅供安装包内嵌网页使用
          VITE_APP_VERSION=${APP_VERSION} VITE_BUILD_CODE=${{ github.run_number }} VITE_BASE_PATH=/heart-trace/ npm run build
          test -s dist/heart-trace.apk
          test -s dist/version.json
          grep -q '/heart-trace/assets/' dist/index.html && echo "网页资源路径已修正"

      - name: 同步版本文件到仓库
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd 心迹-源码
          cp dist/version.json public/version.json
          cp dist/heart-trace.apk public/heart-trace.apk
          cp dist/心迹.apk public/心迹.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/version.json public/heart-trace.apk public/心迹.apk
          git commit -m "同步 v${APP_VERSION} 安装包与版本清单" || echo "无变更"
          git push origin HEAD:main || echo "推送跳过"

      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 心迹-源码/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到网站
        id: deployment
        uses: actions/deploy-pages@v4
