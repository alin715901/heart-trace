name: 构建心迹APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受安卓许可
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 构建网页
        run: |
          cd 心迹-源码
          npm install
          NETLIFY=1 npm run build

      - name: 生成安卓工程
        run: |
          cd 心迹-源码
          npm install -D @capacitor/cli @capacitor/core @capacitor/android
          echo '{"appId":"com.xinji.hearttrace","appName":"心迹","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync

      - name: 构建APK
        run: |
          cd 心迹-源码/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: xinji-apk
          path: 心迹-源码/android/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到下载页
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 心迹 安装包
          files: 心迹-源码/android/app/build/outputs/apk/debug/app-debug.apk
